name: Build watchOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate xcodeproj
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned, real device)
        run: |
          mkdir -p out
          xcodebuild \
            -project WellnessWatch.xcodeproj \
            -scheme WellnessWatch \
            -configuration Release \
            -derivedDataPath build/ \
            -destination 'generic/platform=watchOS' \
            -sdk watchos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64_32" \
            build
          cp -R build/Build/Products/Release-watchos/WellnessWatch.app out/
          cd out && mkdir -p Payload && cp -R WellnessWatch.app Payload/ && \
            zip -r WellnessWatch-unsigned.ipa Payload > /dev/null && \
            rm -rf Payload
          tar czf WellnessWatch-unsigned.app.tar.gz WellnessWatch.app
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WellnessWatch-unsigned
          path: out/WellnessWatch-unsigned.app.tar.gz
          if-no-files-found: error
          retention-days: 7
