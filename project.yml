name: WellnessWatch
options:
  bundleIdPrefix: com.wellness.watch
  deploymentTarget:
    watchOS: "10.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # 强制生成 Xcode 15.4 兼容的 .pbxproj（objectVersion=60）
  # 否则 XcodeGen 在没有 Xcode 的环境会生成 objectVersion=77，
  # 导致 GitHub Actions macos-14 runner（Xcode 15.4）打不开项目。
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    WATCHOS_DEPLOYMENT_TARGET: "10.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_PREVIEWS: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  WellnessWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WellnessWatch
        excludes:
          - "Resources/Info.plist"
          - "Resources/WellnessWatch.entitlements"
    info:
      path: WellnessWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: WellnessWatch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
        NSHealthShareUsageDescription: "用于在 HealthKit 检测到新血压读数时提醒您不要冲动。"
        NSHealthUpdateUsageDescription: "用于记录您手动输入的血压测试结果。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIDeviceFamily:
          - 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wellness.watch.app
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WellnessWatch/Resources/WellnessWatch.entitlements
